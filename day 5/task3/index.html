<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - Events</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="heading">Events and Interaction</h1>
      <button id="headingBtn">Change heading</button>

      <h2>Counter</h2>
      <div class="counter">
        <button id="minusBtn">-</button>
        <span id="count">0</span>
        <button id="plusBtn">+</button>
        <button id="resetBtn">Reset</button>
      </div>

      <h2>Show / Hide</h2>
      <button id="toggleBtn">Hide message</button>
      <p id="message">Now you see me!</p>

      <h2>Live typing</h2>
      <input id="nameInput" type="text" placeholder="Type something..." />
      <p>You typed: <strong id="liveText"></strong></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
